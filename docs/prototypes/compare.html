<!doctype html>
<!-- 原型对比页（throwaway）：四候选 + 选定方案 E；单击任意图放大。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>选中菜单方案对比</title>
<style>
 body{margin:0;background:#20242c;color:#e8eaef;font-family:-apple-system,"PingFang SC",sans-serif}
 h1{font-size:20px;font-weight:600;margin:20px 24px 4px}
 p.sub{margin:0 24px 16px;color:#9aa3af;font-size:13px}
 .row{display:flex;gap:16px;padding:0 24px 20px;align-items:flex-start}
 figure{margin:0;background:#2b303a;border-radius:12px;padding:12px;flex:1 1 0;min-width:0}
 figure img{width:100%;height:auto;display:block;border-radius:8px;cursor:zoom-in}
 figcaption{font-size:13px;color:#c7ccd6;margin-top:10px;line-height:1.5}
 figcaption b{color:#fff}
 .win{background:#1f3a2b;outline:2px solid #57d08a}
 .win figcaption b{color:#8ff0b4}
</style></head><body>
<h1>选中操作菜单 · 方案对比（选定：E）</h1>
<p class="sub">同一段正文 / 同一个选区，只有菜单不同。可交互原型：<code>lynx-novel-text-selection-toolbar.html?variant=A|B|C|D|E</code></p>
<div class="row">
  <figure class="win"><img src="shots/E.png" alt="E"><figcaption><b>E · 【选定】浅色 M3 浮层 + 图标在上文字在下</b><br>C 的底色（surface-container-high + elevation-3）+ B 的条目形态；图标用字形 📋 / 🔍（不新增资源）</figcaption></figure>
</div>
<div class="row">
  <figure><img src="shots/A.png" alt="A"><figcaption><b>A · 反色胶囊（纯文字）</b><br>M3 inverse-surface，最紧凑</figcaption></figure>
  <figure><img src="shots/B.png" alt="B"><figcaption><b>B · 反色工具条（图标+文字）</b><br>同反色底，条目更大更直观</figcaption></figure>
</div>
<div class="row">
  <figure><img src="shots/C.png" alt="C"><figcaption><b>C · 浅色 M3 浮层</b><br>surface-container-high + 阴影，不抢阅读注意力</figcaption></figure>
  <figure><img src="shots/D.png" alt="D"><figcaption><b>D · 极简浮层（分隔线）</b><br>半透明白 + 描边，遮挡最小</figcaption></figure>
</div>
</body></html>
