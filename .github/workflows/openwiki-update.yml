name: OpenWiki Update

on:
  workflow_dispatch:
    inputs:
      debug:
        description: "加 --debug 跑（失败时输出凭据/错误诊断；本仓库公开，日志同样公开）"
        type: boolean
        default: false
  schedule:
    # 8 点是 UTC，不是北京时间。原值 0 8 * * * = 北京 16:00，且 GitHub 定时任务是
    # best-effort，实测启动落在 12:37–16:23 UTC（北京 20:37–00:23）——刷新发生在
    # 下班之后，白天读到的永远是上一轮。曾改成北京 09:00，现按需改为北京 18:10（UTC 10:10）。
    # 注意 GitHub 仍会延迟数小时。
    - cron: "10 10 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    # 防挂死：0.7.x 的 --print 仍是批量缓冲输出（openwiki#924 未修），长跑期间日志全白，
    # 分不清"在跑"和"卡死"。用超时把挂死转成显式失败，而不是白烧 6 小时 runner。
    # 90 → 150：实测 13 个页面全量重写要 56 分钟（2026-10-08 实测，输出全部缓冲到
    # 结束才刷出，中途日志全白），90 分钟只剩 1.6 倍余量，仓库继续增长随时会撞线。
    timeout-minutes: 150
    steps:
      - name: Check required secret
        # 提前暴露缺失的 key，避免裸报错（DeepSeek 走 OpenAI 兼容端点，必须有 OPENAI_COMPATIBLE_API_KEY）
        # 含脱敏诊断：仅输出长度/是否空白/首尾字节（不泄露 key 内容）
        env:
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENAI_COMPATIBLE_API_KEY }}
        run: |
          if [ -z "${OPENAI_COMPATIBLE_API_KEY}" ]; then
            echo "::error::OPENAI_COMPATIBLE_API_KEY is not configured. Add it in repo Settings → Secrets and variables → Actions, then re-run this workflow (or trigger it manually via workflow_dispatch)."
            exit 1
          fi
          echo "key length=${#OPENAI_COMPATIBLE_API_KEY}"
          echo "key all-whitespace=$([ -z "$(printf '%s' "$OPENAI_COMPATIBLE_API_KEY" | tr -d '[:space:]')" ] && echo yes || echo no)"
          echo "key first byte=$(printf '%s' "$OPENAI_COMPATIBLE_API_KEY" | head -c 1 | od -An -tx1 | tr -d ' ')"
          echo "key last byte=$(printf '%s' "$OPENAI_COMPATIBLE_API_KEY" | tail -c 1 | od -An -tx1 | tr -d ' ')"

      - name: Check PAT secret
        # auto-merge / PR 创建依赖 PAT（避免 bot 身份触发 CI 审批），缺失则提前失败并给出配置指引
        env:
          OPENWIKI_PAT: ${{ secrets.OPENWIKI_PAT }}
        run: |
          if [ -z "${OPENWIKI_PAT}" ]; then
            echo "::error::OPENWIKI_PAT is not configured. Create a PAT (repo scope: contents:write, pull-requests:write) and add it to repo Settings → Secrets and variables → Actions, then re-run this workflow (or trigger it manually via workflow_dispatch)."
            exit 1
          fi
          echo "PAT length=${#OPENWIKI_PAT}"

      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # 根因修复。`openwiki code --update` 拿 HEAD 与 .last-update.json 里记录的
          # gitHead 做 diff；默认浅克隆（depth=1）里没有那个 commit，于是变更摘要为空，
          # agent 判定"无变更"空跑退出，但照样把 gitHead 推到当天 HEAD、status 写
          # complete、CI 报 success。实测该状态下 10 次 schedule 全部 ≤12 分钟、
          # 零内容变化（见 no-op 门禁）。0.7.0 官方模板同样明确要求 fetch-depth: 0。
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install OpenWiki
        # mermaid + jsdom are optional; they add high-fidelity validation of Mermaid diagrams. Remove if your wiki has none.
        # 0.7.0 → 0.7.1（2026-10-06）。本仓库两次 "worker exited without submitting"
        #（10-06 死在 Planning、10-08 死在 quickstart 页面 worker）都发生在 0.7.0 上，
        # 而 0.7.1 恰好收录了对应的上游修复：
        #   #981 保留 openai-compatible 模型工具 schema 的可选参数（strict 默认 false）
        #        closes #978——本仓库正走 openai-compatible；#978 报告模型反复给新 Claim
        #        塞 id、撞归属校验而始终不调 submit_page，与本页症状同源，疑为根因
        #   #913 页面 worker 未 submit_page 时先重试一次再跳过，closes #850——10-08
        #        quickstart.md 的失败路径逐字对应（"restored…skipped" + interrupted finalization）
        #   #865 限定 planner 只在页面图/导航真变了才刷新 quickstart.md，closes #797
        #   #979 同一 wiki 页面的并发文件操作串行化，closes #968（page worker 并行的竞态）
        # 0.2.5 → 0.7.0（2026-10-02）。与本仓库直接相关的上游修复：
        #   #817 updates 模式兼容 openai-compatible 流式分片 · #861 规范化嵌套 text content
        #   数组让严格 vLLM 端点接受回放 tool output · #888 禁 agent 任意 shell ·
        #   #901 根绝对内链检测 · #914 替换旧标记块而非追加重复 · #938 --debug 打最内层
        #   失败原因 · #840 状态文件原子写 · #933 code 模式不再建 CLAUDE.md ·
        #   #903 页面 worker 并行 · #905 MCP search/read/link
        # 0.5.2 起要求 Node ≥ 22.22.0（#863），本 workflow 用 setup-node "22" 满足。
        run: npm install --global openwiki@0.7.1 mermaid@11.16.0 jsdom@29.1.1

      - name: Snapshot pre-run OpenWiki state
        # 必须在 run 之前记下上一次的 gitHead——run 会把它覆盖掉，之后就无从比较了
        id: prestate
        run: |
          FILE=openwiki/.last-update.json
          if [ -f "$FILE" ]; then
            OLD_HEAD=$(node -p "require('./$FILE').gitHead ?? ''" 2>/dev/null || echo "")
          else
            OLD_HEAD=""
          fi
          echo "gitHead=$OLD_HEAD" >> "$GITHUB_OUTPUT"
          echo "上次记录的 gitHead: ${OLD_HEAD:-<无，首次运行>}"

      - name: Run OpenWiki
        id: openwiki
        # 官方模板的取舍：run 失败也走完后续流程，让已完成的页面以 PR 形式保留下来
        # （一次跑批几十分钟，不能白费），最后由末尾步骤把 job 标红并拦住自动合并。
        continue-on-error: true
        # --print 是单次非交互模式，CI 必需：裸 `openwiki` 会起 Ink TUI，非 TTY 下报
        # "Raw mode is not supported"。--debug 仅在手动触发且显式勾选时加：仓库公开，
        # 凭据诊断不该默认进公开日志。
        run: |
          if [ "${{ inputs.debug }}" = "true" ]; then
            echo "::notice::debug 模式开启"
            openwiki code --update --print --debug
          else
            openwiki code --update --print
          fi
        env:
          # 与本地开发环境一致：DeepSeek 走 OpenAI 兼容端点（见 ~/.openwiki/.env）
          OPENWIKI_PROVIDER: openai-compatible
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENAI_COMPATIBLE_API_KEY }}
          OPENAI_COMPATIBLE_BASE_URL: https://api.deepseek.com/v1
          OPENWIKI_MODEL_ID: deepseek-flash
          # LangSmith tracing 仅配置了 key 才启用
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGCHAIN_PROJECT: openwiki
          LANGCHAIN_TRACING_V2: ${{ secrets.LANGSMITH_API_KEY != '' }}

      - name: Remove transient OpenWiki run state
        # .run.json 是断点续跑用的临时状态（0.5.0 #720），不该进版本库：旧配置 add-paths
        # 直接写 openwiki 目录，会把它一起 commit 进去。
        if: ${{ !cancelled() }}
        run: rm -f -- openwiki/.run.json

      - name: Remove deprecated CLAUDE.md
        # AGENTS.md 为唯一 agent 指令载体。0.6.1 起 code 模式不再创建该文件（#933），
        # 这步是双保险。本仓库未跟踪 CLAUDE.md，因此只需本地清理，不进 add-paths。
        run: rm -f CLAUDE.md

      - name: List OpenWiki update paths
        id: paths
        if: ${{ !cancelled() }}
        run: |
          echo "list=openwiki,AGENTS.md,.github/workflows/openwiki-update.yml" >> "$GITHUB_OUTPUT"

      - name: Detect silent no-op update
        # 抓"假绿"：进程成功、CI 报 success，但 openwiki 一页没改。
        # 上一道 complete 门禁挡不住这类失败——空跑时 status 就是 complete。
        # 必须在 create-pull-request 之前跑：那一步会把改动提交掉，之后 diff 就空了。
        # 这里只判定并输出标记，硬失败放在建 PR 之后，以保留"失败也留下已完成页面"。
        id: noop
        env:
          OLD_GIT_HEAD: ${{ steps.prestate.outputs.gitHead }}
        run: |
          set -uo pipefail
          FILE=openwiki/.last-update.json
          NEW_HEAD=$(node -p "require('./$FILE').gitHead ?? ''" 2>/dev/null || echo "")

          if [ -z "$OLD_GIT_HEAD" ]; then
            echo "首次运行（无历史 gitHead），跳过 no-op 检测"
            echo "detected=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$NEW_HEAD" = "$OLD_GIT_HEAD" ]; then
            echo "::warning::gitHead 未前进（仍为 ${NEW_HEAD}）——本次 run 连状态戳都没更新"
            echo "detected=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "gitHead: $OLD_GIT_HEAD → $NEW_HEAD"

          # 区间内是否有非 docs 的源码改动（openwiki/ 与 AGENTS.md 自身排除）
          SRC=$(git diff --name-only "$OLD_GIT_HEAD" "$NEW_HEAD" -- . \
                ':(exclude)docs' ':(exclude)openwiki' ':(exclude)AGENTS.md' 2>/dev/null | wc -l | tr -d ' ')
          echo "区间内非 docs 改动文件数: $SRC"
          if [ "$SRC" -eq 0 ]; then
            echo "区间内只有 docs/ 变动，wiki 无内容变化属预期"
            echo "detected=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # 内容 diff：排除纯状态文件（每次都会变，不构成内容更新）
          if git diff --quiet -- openwiki \
                ':(exclude)openwiki/.last-update.json' \
                ':(exclude)openwiki/.run.json' 2>/dev/null; then
            echo "::error::gitHead 前进了、源码也变了 $SRC 个文件，但 openwiki/ 零内容变化 —— 空跑假绿"
            echo "detected=true" >> "$GITHUB_OUTPUT"
          else
            CHANGED=$(git diff --name-only -- openwiki \
                ':(exclude)openwiki/.last-update.json' \
                ':(exclude)openwiki/.run.json' 2>/dev/null | wc -l | tr -d ' ')
            echo "openwiki/ 有内容变化（$CHANGED 个文件）✓"
            echo "detected=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create OpenWiki update pull request
        id: create-pr
        if: ${{ !cancelled() }}
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          # 用 PAT 而非 GITHUB_TOKEN：bot 身份创建/更新 PR 会让 CI 每次等待人工批准
          # （GitHub 对 github-actions[bot] 触发的 PR 事件 workflow 要求 maintainer 审批），
          # PAT 身份使 CI 无需批准即可运行。
          token: ${{ secrets.OPENWIKI_PAT }}
          add-paths: ${{ steps.paths.outputs.list }}
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update.

            OpenWiki result: ${{ steps.openwiki.outcome }}

            When the result is `failure`, this PR intentionally preserves only the
            pages completed before the failure. It is **not** auto-merged: the
            auto-merge gates require `openwiki/.last-update.json` to report
            `status: complete` **and** require a real content change when the source
            moved. Review it by hand and merge manually if the partial progress is
            worth keeping as the baseline for the next run.

      - name: Gate auto-merge on a complete run
        # 门禁 1：状态文件说"完成"才允许无人复核合并。
        # 位置说明：必须排在 create-pull-request **之后**——中断的 run 也要先把已完成的页面
        # 留成 PR 供人工判断（官方模板的取舍），只是不许自动合并。
        # 0.7.0 在 run 开始时就把 status 写成 interrupted（崩溃守卫上膛），跑完才翻成
        # complete —— 实测确认。langchain-ai/openwiki#921 记录过被中断的 run 仍可能以
        # exit 0 结束，所以退出码不是可信信号，状态文件才是。
        run: |
          set -euo pipefail
          FILE=openwiki/.last-update.json
          if [ ! -f "$FILE" ]; then
            echo "::error::$FILE 不存在——本次 run 没有产出状态文件，禁止自动合并"
            exit 1
          fi
          if ! STATUS=$(node -p "require('./$FILE').status" 2>/dev/null); then
            echo "::error::$FILE 损坏或无法解析，禁止自动合并"
            exit 1
          fi
          GIT_HEAD=$(node -p "require('./$FILE').gitHead ?? ''" 2>/dev/null || echo "")
          echo "openwiki status=$STATUS gitHead=${GIT_HEAD:-<none>} checkout=$(git rev-parse HEAD)"
          if [ "$STATUS" != "complete" ]; then
            echo "::error::openwiki 本次 run 未完成（status=${STATUS}），禁止自动合并。上方 PR 已保留本次跑完的页面，请人工判断"
            exit 1
          fi

      - name: Enforce no-op detection
        # 门禁 2：空跑假绿。放在建 PR 之后，以保留上游"失败也留下已完成页面"的取舍，
        # 只拦住无人复核的自动合并。
        #
        # 已知误报面：若某次源码改动确实不影响任何 wiki 页面（例如仅重命名测试文件、
        # 而 testing 页只按目录归纳），内容 diff 会为空而源码计数不为 0，此时会误判。
        # 放宽办法：把 SRC 阈值调大，或把纯测试路径加入排除。当前按"宁可停下让人看一眼"
        # 取舍——假绿的代价是 wiki 静默失真，误报的代价是一次人工确认。
        if: ${{ steps.noop.outputs.detected == 'true' }}
        run: |
          echo "::error::检测到空跑：openwiki 推进了 gitHead 但未产出任何内容变化"
          echo "::error::排查方向：① checkout 是否浅克隆（需要 fetch-depth: 0）"
          echo "::error::          ② openwiki 是否在 planning 阶段就判定无变更"
          echo "::error::          ③ 打开本次 run 日志看 --update 的实际耗时（空跑通常 ≤5 分钟）"
          exit 1

      - name: Propagate OpenWiki failure
        if: ${{ steps.openwiki.outcome == 'failure' }}
        run: exit 1

      - name: Enable auto-merge on OpenWiki PR
        # PR 已存在（本 run 只是更新内容）时 create-pull-request 不输出 pull-request-number，
        # 因此按分支名查找当前 open PR，对已有的 auto-merge 设置保持幂等
        env:
          GH_TOKEN: ${{ secrets.OPENWIKI_PAT }}
        run: |
          PR_NUMBER=$(gh pr list --head openwiki/update --state open --json number -q '.[0].number')
          if [ -n "$PR_NUMBER" ]; then
            gh pr merge "$PR_NUMBER" --auto --squash
            echo "Enabled auto-merge on PR #$PR_NUMBER"
          else
            echo "No open PR on openwiki/update; nothing to auto-merge"
          fi
