apply plugin: 'com.android.application'

// OTA web bundle 验签公钥（#248/#249）：raw 32B 的 base64，与 ~/.pictelio-keys/ota-ed25519
// 私钥同对（指纹记录见 docs/research/ota-ed25519-android.md §4.2）。公开物可入库；
// 构建期长度校验防手滑截断（签名失败在运行期才暴露就晚了）。
def otaPublicKeyB64 = "ST/sQxNxrrZXOWwiuKdqqp79p3njn6MvIMWwJQTXWQY="
if (java.util.Base64.getDecoder().decode(otaPublicKeyB64).length != 32) {
    throw new GradleException("OTA_ED25519_PUBLIC_KEY_B64 must decode to exactly 32 raw bytes")
}

android {
    namespace = "io.pictelio.app"
    compileSdk = rootProject.ext.compileSdkVersion
    buildToolsVersion = "36.1.0"

    defaultConfig {
        applicationId "io.pictelio.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // 单引擎线（#802 起）：线上 v6.1.0 已是 60100，同号则无法覆盖安装，故抬到 602xx。
        // 现值 60201（过渡版 v6.2.1 已发布占用）——事实源是 packages/app/package.json 的 version，
        // 由 `pnpm sync:android-version`（scripts/sync-android-version.mjs）按
        // major×10000+minor×100+patch 推导写回；**直接改本行会被该脚本覆盖回旧值**。
        // ⚠️ 本分支已合回单引擎 main（PR #818）：原注释「不合进 main / main 走 60300」
        // 是过渡分支并行期的假设，随合并作废。
        // 待定：合回后 versionCode 序列尚未拍板（另起主线 60300，还是顺延 60202），
        // 见 #819；未定案前不动本值。
        versionCode 60701
        versionName "6.7.1"
        buildConfigField "String", "OTA_ED25519_PUBLIC_KEY_B64", "\"${otaPublicKeyB64}\""
        // 沙盒 #610：client flavor 维度下线（WebView/Capacitor 线整体删除），
        // 入口写死 Lynx。占位符机制保留但不再按 flavor 注入。
        manifestPlaceholders = [launcherActivity: ".LynxActivity", appClass: ".PictelioAppLynx"]
        // ADR-0062：包支持的 client 引擎列表（BuildConfig.CLIENT_KINDS）。
        // ADR-0164：CLIENT_KINDS[0] 是 Java 侧缺省引擎的单一事实来源。
        // 单引擎后取值塌缩为 {"lynx"}，但**机制与消费方一律保留**——
        // WebView 线是暂时下线后重写（非永久废弃），重写回归时该机制原样可用。
        buildConfigField "String[]", "CLIENT_KINDS", '{"lynx"}'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    // ── Source sets（沙盒 #610：单引擎）───────────────────────
    // 原 lynx flavor 的 srcDir 提升为 main 的附加目录：类路径与包名不动，
    // 只改编译归属。保留目录形态（而非把文件搬进 src/main/java），
    // 是为了 WebView 重写回归时能原样切回 flavor 结构。
    sourceSets {
        main {
            java.srcDir 'src/lynx/java'
        }
        // 沙盒 #610：testFull 的 Lynx 模块测试并入 test（single variant 编译时
        // test 源集即可看到 main 里的 Lynx 类）。
        test {
            java.srcDir 'src/testLynx/java'
        }
    }

    buildFeatures {
        buildConfig = true
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    signingConfigs {
        release {
            storeFile file("pictelio-release.keystore")
            storePassword System.getenv("PICTELIO_KEYSTORE_PASSWORD")
            keyAlias "pictelio"
            keyPassword System.getenv("PICTELIO_KEY_PASSWORD")
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        // bcprov multi-release jar 的 META-INF/versions/9 对 Android 运行时无效
        // （#248：AGP 对 MRJAR 重复路径冲突的预案，docs/research/ota-ed25519-android.md §3.1）
        variant.packaging.resources.excludes.add('META-INF/versions/9/**')
    }
}

// ── APK 输出改名（#118）────────────────────────────────────
// 沙盒 #610：flavor 维度下线，variant 名退化为纯 buildType（debug / release）。
// 命名保留 buildType 段以区分调试包与签名包：
// pictelio-{versionName}-{buildType}.apk
def buildTypeList2 = ['debug', 'release']

buildTypeList2.each { bt ->
    def variantName = bt
    def assembleTaskName = "assemble${bt.capitalize()}"
    def renameTaskName = "rename${bt.capitalize()}Apk"

    def apkDirStr = "${project.layout.buildDirectory.get()}/outputs/apk/${bt}"
    def versionName = android.defaultConfig.versionName
    tasks.register(renameTaskName) {
        dependsOn assembleTaskName
        // 每次构建都重命名最新产物（覆盖旧的 pictelio-*.apk），避免发布旧包
        outputs.upToDateWhen { false }
        doLast {
            def srcApk = new File("${apkDirStr}/app-${bt}.apk")
            def destApk = new File("${apkDirStr}/pictelio-${versionName}-${bt}.apk")
            if (srcApk.exists()) {
                if (destApk.exists()) {
                    destApk.delete()
                }
                if (!srcApk.renameTo(destApk)) {
                    throw new GradleException("APK 重命名失败: ${srcApk.name} -> ${destApk.name}")
                }
                println "Renamed: ${srcApk.name} -> ${destApk.name}"
            }
        }
    }
}

// 沙盒 #610：原「Assets 裁剪」整块下线。webview 变体排除 lynx bundle、
// lynx 变体排除 public/ 与 capacitor 配置——两者都随 cap:sync 与 webview
// flavor 一并消失，assets 只剩 main.lynx.bundle（sync-android-assets 注入），
// 无需再靠 clean task 裁剪。

// 仅在执行 Release 构建时校验签名凭据，避免 Debug 构建需要环境变量
def validateReleaseSigning() {
    def keystorePassword = System.getenv("PICTELIO_KEYSTORE_PASSWORD")
    def keyPassword = System.getenv("PICTELIO_KEY_PASSWORD")
    if (keystorePassword == null || keystorePassword.isEmpty()) {
        throw new GradleException("Missing environment variable PICTELIO_KEYSTORE_PASSWORD. See docs/release-signing.md")
    }
    if (keyPassword == null || keyPassword.isEmpty()) {
        throw new GradleException("Missing environment variable PICTELIO_KEY_PASSWORD. See docs/release-signing.md")
    }
    if (!file("pictelio-release.keystore").exists()) {
        throw new GradleException("Release keystore not found at android/app/pictelio-release.keystore. See docs/release-signing.md")
    }
}

gradle.taskGraph.whenReady { graph ->
    def releaseTasks = [':app:assembleRelease', ':app:packageRelease', ':app:bundleRelease', ':app:signReleaseApk', ':app:signReleaseBundle']
    if (graph.allTasks.any { it.path in releaseTasks }) {
        validateReleaseSigning()
    }
}

repositories {
}

dependencies {
    // ── Shared ──
    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation("com.squareup.okhttp3:okhttp:4.12.0")

    // ── Lynx ──
    // 沙盒 #610：原 lynxImplementation 随 flavor 维度下线一并提升为 implementation。
    // Lynx SDK（#52 起引入：LynxModule 编译依赖；完整配置见 #51 原生 LynxView 壳）
    implementation "org.lynxsdk.lynx:lynx:4.0.1"
    // Lynx Service（官方集成要求，#51 补充）：
    // - lynx-service-http：lynx.fetch 依赖（未注册则原生 fetch 不可用 → API/OAuth 断）
    // - lynx-service-log：日志服务（官方基线）
    // 图片服务（lynx-service-image/Fresco）不引入——i.pximg.net 需 Referer 头，
    // Fresco 默认不传 customParam 为 header（403），自研 ILynxImageService（#54）
    implementation "org.lynxsdk.lynx:lynx-service-http:4.0.1"
    implementation "org.lynxsdk.lynx:lynx-service-log:4.0.1"
    // XElement（官方扩展元件，#51 真机实测必需）：
    // 基础 xelement 提供扩展 behaviors；xelement-input 提供 <input>/<textarea>
    // （LynxError 990200 "No BehaviorController defined for class input"，
    //  真机 2026-08-01 Login.vue 输入框渲染失败 → 补依赖 + LynxActivity addBehaviors）
    implementation "org.lynxsdk.lynx:xelement:4.0.1"
    implementation "org.lynxsdk.lynx:xelement-input:4.0.1"

    // ── Test ──
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.robolectric:robolectric:4.14.1"
    testImplementation "androidx.test:core:1.6.1"
    testImplementation("com.squareup.okhttp3:mockwebserver:4.12.0")
    // TLS 全链路测试（#389 DirectAccessTransport）：HeldCertificate 构造 i.pximg.net 测试证书，
    // 版本对齐 mockwebserver/okhttp（仅 testImplementation，主 implementation 不动）
    testImplementation("com.squareup.okhttp3:okhttp-tls:4.12.0")
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
