apply plugin: 'com.android.application'

// OTA web bundle 验签公钥（#248/#249）：raw 32B 的 base64，与 ~/.pictelio-keys/ota-ed25519
// 私钥同对（指纹记录见 docs/research/ota-ed25519-android.md §4.2）。公开物可入库；
// 构建期长度校验防手滑截断（签名失败在运行期才暴露就晚了）。
def otaPublicKeyB64 = "ST/sQxNxrrZXOWwiuKdqqp79p3njn6MvIMWwJQTXWQY="
if (java.util.Base64.getDecoder().decode(otaPublicKeyB64).length != 32) {
    throw new GradleException("OTA_ED25519_PUBLIC_KEY_B64 must decode to exactly 32 raw bytes")
}

android {
    namespace = "io.pictelio.app"
    compileSdk = rootProject.ext.compileSdkVersion
    buildToolsVersion = "36.1.0"

    defaultConfig {
        applicationId "io.pictelio.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 42100
        versionName "4.21.0"
        buildConfigField "String", "OTA_ED25519_PUBLIC_KEY_B64", "\"${otaPublicKeyB64}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    // ── Product Flavors（#116：三分包）──────────────────────────
    flavorDimensions "client"
    productFlavors {
        full {
            dimension "client"
            manifestPlaceholders = [launcherActivity: ".MainActivity", appClass: ".PictelioApp"]
            // ADR-0062：包支持的 client 引擎列表（BuildConfig.CLIENT_KINDS）
            buildConfigField "String[]", "CLIENT_KINDS", '{"webview", "lynx"}'
        }
        webview {
            dimension "client"
            manifestPlaceholders = [launcherActivity: ".MainActivityWebview", appClass: ".PictelioAppWebview"]
            buildConfigField "String[]", "CLIENT_KINDS", '{"webview"}'
        }
        lynx {
            dimension "client"
            manifestPlaceholders = [launcherActivity: ".LynxActivity", appClass: ".PictelioAppLynx"]
            buildConfigField "String[]", "CLIENT_KINDS", '{"lynx"}'
        }
    }

    sourceSets {
        // webview flavor：Capacitor 插件 + MainActivity + PictelioApp(webview)
        webview {
            java.srcDir 'src/webview/java'
        }
        // lynx flavor：Lynx Native Modules + LynxActivity + PictelioApp(lynx)
        lynx {
            java.srcDir 'src/lynx/java'
        }
        // full flavor：双 client 合并 + PictelioApp(full 条件分支)
        full {
            java.srcDir 'src/webview/java'
            java.srcDir 'src/lynx/java'
            java.srcDir 'src/full/java'
        }
    }

    buildFeatures {
        buildConfig = true
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    signingConfigs {
        release {
            storeFile file("pictelio-release.keystore")
            storePassword System.getenv("PICTELIO_KEYSTORE_PASSWORD")
            keyAlias "pictelio"
            keyPassword System.getenv("PICTELIO_KEY_PASSWORD")
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

// APK 输出按 flavor 重命名（#118）：pictelio-{versionName}-{flavor}.apk
// webview flavor 同时排除 lynx bundle
androidComponents {
    onVariants(selector().all()) { variant ->
        def flavorName = variant.flavorName
        if (flavorName == 'webview') {
            variant.packaging.resources.excludes.add('main.lynx.bundle')
        }
        // bcprov multi-release jar 的 META-INF/versions/9 对 Android 运行时无效
        // （#248：AGP 对 MRJAR 重复路径冲突的预案，docs/research/ota-ed25519-android.md §3.1）
        variant.packaging.resources.excludes.add('META-INF/versions/9/**')
    }
}

// ── APK 输出改名（#118）────────────────────────────────────
// AGP 9：variant.outputs 的 outputFileName 只读，改用 variant.name 派生目录，
// 并在 package 任务后复制/重命名。此处直接配置输出目录命名由 AGP 生成
// app-{flavor}-{buildType}.apk，发布脚本按此模式定位即可——
// 为保持 spec 约定的 pictelio-{version}-{flavor}.apk，用 task 重命名。
def flavorNames = ['full', 'webview', 'lynx']
def buildTypeList2 = ['debug', 'release']

flavorNames.each { flavor ->
    buildTypeList2.each { bt ->
        def variantName = "${flavor}${bt.capitalize()}"
        def assembleTaskName = "assemble${variantName.capitalize()}"
        def renameTaskName = "rename${variantName.capitalize()}Apk"

        def apkDirStr = "${project.layout.buildDirectory.get()}/outputs/apk/${flavor}/${bt}"
        def versionName = android.defaultConfig.versionName
        tasks.register(renameTaskName) {
            dependsOn assembleTaskName
            // 每次构建都重命名最新产物（覆盖旧的 pictelio-*.apk），避免发布旧包
            outputs.upToDateWhen { false }
            doLast {
                def srcApk = new File("${apkDirStr}/app-${flavor}-${bt}.apk")
                def destApk = new File("${apkDirStr}/pictelio-${versionName}-${flavor}.apk")
                if (srcApk.exists()) {
                    if (destApk.exists()) {
                        destApk.delete()
                    }
                    if (!srcApk.renameTo(destApk)) {
                        throw new GradleException("APK 重命名失败: ${srcApk.name} -> ${destApk.name}")
                    }
                    println "Renamed: ${srcApk.name} -> ${destApk.name}"
                }
            }
        }
    }
}

// ── Assets 裁剪（#118）──────────────────────────────────────
// webview：从 assets 中排除 lynx bundle
// lynx：从 assets 中排除 web public/ 和 capacitor 配置
// 原理：clean task 删除 merge 输出中的多余文件 + 删除 compress 的整个输出目录
//       （输出目录丢失 → Gradle 强制 compress 重跑 → 打包读取干净产物）
def flavorList = ['webview', 'lynx']
def buildTypeList = ['debug', 'release']

flavorList.each { flavor ->
    buildTypeList.each { bt ->
        def variantName = "${flavor}${bt.capitalize()}"
        def mergeTaskName = "merge${variantName.capitalize()}Assets"
        def compressTaskName = "compress${variantName.capitalize()}Assets"
        def cleanTaskName = "clean${variantName.capitalize()}Assets"
        def assetsDir = "${layout.buildDirectory.get()}/intermediates/assets/${variantName}/${mergeTaskName}"
        def compressedDir = "${layout.buildDirectory.get()}/intermediates/compressed_assets/${variantName}/${compressTaskName}/out"

        tasks.register(cleanTaskName, Delete) {
            // 清 merge 产物中的多余文件
            if (flavor == 'webview') {
                delete "${assetsDir}/main.lynx.bundle"
            } else if (flavor == 'lynx') {
                delete "${assetsDir}/public"
                delete "${assetsDir}/capacitor.config.json"
                delete "${assetsDir}/capacitor.plugins.json"
            }
            // 删 compress 整个输出目录 → 强制 compress 重跑
            delete compressedDir
        }

        // clean 在 merge 之后、compress 之前执行
        tasks.matching { it.name == mergeTaskName }.configureEach {
            finalizedBy cleanTaskName
        }
        tasks.matching { it.name == compressTaskName }.configureEach {
            mustRunAfter cleanTaskName
            // 禁用 build cache：clean 删除了中间产物，compress 必须重跑读干净输入
            outputs.cacheIf { false }
        }
    }
}

// 仅在执行 Release 构建时校验签名凭据，避免 Debug 构建需要环境变量
def validateReleaseSigning() {
    def keystorePassword = System.getenv("PICTELIO_KEYSTORE_PASSWORD")
    def keyPassword = System.getenv("PICTELIO_KEY_PASSWORD")
    if (keystorePassword == null || keystorePassword.isEmpty()) {
        throw new GradleException("Missing environment variable PICTELIO_KEYSTORE_PASSWORD. See docs/release-signing.md")
    }
    if (keyPassword == null || keyPassword.isEmpty()) {
        throw new GradleException("Missing environment variable PICTELIO_KEY_PASSWORD. See docs/release-signing.md")
    }
    if (!file("pictelio-release.keystore").exists()) {
        throw new GradleException("Release keystore not found at android/app/pictelio-release.keystore. See docs/release-signing.md")
    }
}

gradle.taskGraph.whenReady { graph ->
    def releaseTasks = [':app:assembleRelease', ':app:packageRelease', ':app:bundleRelease', ':app:signReleaseApk', ':app:signReleaseBundle',
                        ':app:assembleFullRelease', ':app:assembleWebviewRelease', ':app:assembleLynxRelease']
    if (graph.allTasks.any { it.path in releaseTasks }) {
        validateReleaseSigning()
    }
}

repositories {
}

dependencies {
    // ── Shared（双端共用）──
    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation("com.squareup.okhttp3:okhttp:4.12.0")

    // ── WebView-only（Capacitor 系）──
    webviewImplementation fileTree(include: ['*.jar', '*.aar'], dir: '../capacitor-cordova-android-plugins/src/main/libs')
    webviewImplementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    webviewImplementation project(':capacitor-android')
    webviewImplementation project(':capacitor-cordova-android-plugins')
    // OTA web bundle Ed25519 验签（#248）：bcprov lightweight API（不注册 JCA provider，
    // 绕开 Android 内置裁剪版 BC 冲突与 API 33+ 文档陷阱，docs/research/ota-ed25519-android.md）。
    // full flavor 编译 src/webview/java 源集 → 两个 flavor 都要挂。
    webviewImplementation "org.bouncycastle:bcprov-jdk18on:1.85.2"

    // ── Lynx-only ──
    // Lynx SDK（#52 起引入：LynxModule 编译依赖；完整配置见 #51 原生 LynxView 壳）
    lynxImplementation "org.lynxsdk.lynx:lynx:4.0.1"
    // Lynx Service（官方集成要求，#51 补充）：
    // - lynx-service-http：lynx.fetch 依赖（未注册则原生 fetch 不可用 → API/OAuth 断）
    // - lynx-service-log：日志服务（官方基线）
    // 图片服务（lynx-service-image/Fresco）不引入——i.pximg.net 需 Referer 头，
    // Fresco 默认不传 customParam 为 header（403），自研 ILynxImageService（#54）
    lynxImplementation "org.lynxsdk.lynx:lynx-service-http:4.0.1"
    lynxImplementation "org.lynxsdk.lynx:lynx-service-log:4.0.1"
    // XElement（官方扩展元件，#51 真机实测必需）：
    // 基础 xelement 提供扩展 behaviors；xelement-input 提供 <input>/<textarea>
    // （LynxError 990200 "No BehaviorController defined for class input"，
    //  真机 2026-08-01 Login.vue 输入框渲染失败 → 补依赖 + LynxActivity addBehaviors）
    lynxImplementation "org.lynxsdk.lynx:xelement:4.0.1"
    lynxImplementation "org.lynxsdk.lynx:xelement-input:4.0.1"

    // ── Full = webview + lynx 并集 ──
    fullImplementation fileTree(include: ['*.jar', '*.aar'], dir: '../capacitor-cordova-android-plugins/src/main/libs')
    fullImplementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    fullImplementation project(':capacitor-android')
    fullImplementation project(':capacitor-cordova-android-plugins')
    fullImplementation "org.lynxsdk.lynx:lynx:4.0.1"
    fullImplementation "org.lynxsdk.lynx:lynx-service-http:4.0.1"
    fullImplementation "org.lynxsdk.lynx:lynx-service-log:4.0.1"
    fullImplementation "org.lynxsdk.lynx:xelement:4.0.1"
    fullImplementation "org.lynxsdk.lynx:xelement-input:4.0.1"
    fullImplementation "org.bouncycastle:bcprov-jdk18on:1.85.2"

    // ── Test ──
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.robolectric:robolectric:4.14.1"
    testImplementation "androidx.test:core:1.6.1"
    testImplementation("com.squareup.okhttp3:mockwebserver:4.12.0")
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
