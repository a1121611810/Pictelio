# ═══════════════════════════════════════════
# pnpm-workspace.yaml — 项目配置
# ═══════════════════════════════════════════

# ── 工作区 ──
packages:
  - "."
  - "packages/*"

# ── 供应链安全 ──

# 新包冷却期：24 小时内发布的包禁止安装
# 防止攻击者利用刚发布的热门包恶意版本
minimumReleaseAge: 1440

# 豁免：@lynx-js 官方发布包（lynx-family），T1 决策锁定的 PoC 已验证版本
# （vue-lynx 工具链依赖最新 web-core，官方渠道可信）
minimumReleaseAgeExclude:
  - "@lynx-js/web-core@0.23.1"
  - "@lynx-js/web-worker-rpc@0.23.1"

# 阻止信任降级：如果某包之前有来源证明/签名，
# 新版本若缺少则会安装失败
trustPolicy: no-downgrade

# 超过 30 天（43200 min）的旧包跳过信任检查
# 这些版本发布时 npm 尚未普及 provenance 签名机制
trustPolicyIgnoreAfter: 43200

# 禁止传递依赖从 git/URL 等不可信来源安装
blockExoticSubdeps: true

# 管控 postinstall 脚本（当前项目无此类依赖
# 以后新增包若有 install 脚本需手动加入白名单）
allowBuilds:
  agent-browser: true
  appium: true
  canvas: true
  core-js: true
  edgedriver: false
  esbuild: true
  geckodriver: false
  vue-demi: true
  # pnpm install 会自动列出待审批的包到这里

  # ── 依赖解析优化 ──

  # 子依赖按时间点解析：防止子依赖劫持
resolutionMode: time-based

# 允许屏蔽特定废弃包的提醒
allowedDeprecatedVersions:
  request: "*"

# ── 依赖覆盖 ──

# 对齐 lynx 工具链 peer 声明（不触碰 T1 锁定的 web-core@0.23.1）：
# - css-serializer@0.1.7 = web-core@0.23.1 的 devDep/peer 声明版本（上游测试矩阵）
# - template-webpack-plugin@0.11.0 = css-extract-webpack-plugin@0.7.1 的 peer 声明版本
# 消除 `pnpm peers check` 的两条警告（源自 template-webpack-plugin@0.10.9 发版时的
# 上游 packaging 不一致，详见 ADR-0080）
overrides:
  "@lynx-js/css-serializer": "0.1.7"
  "@lynx-js/template-webpack-plugin": "0.11.0"

# ── 开发体验 ──

# 跨平台 bash 模拟（Windows/Mac/Linux 脚本统一）
shellEmulator: true
